name: Release
on:
  release:
    types: [published]
jobs:
  attach:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - name: dist matches the sources
        run: node build.mjs --check
      - name: attach savvy-cards.js to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" dist/savvy-cards.js --clobber
