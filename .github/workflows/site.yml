# Publishes the live demo (site/) to GitHub Pages. Runs only when started by hand
# (Actions, "Demo site", Run workflow) until you decide it should follow every release.
# Before the first run: Settings, Pages, Source "GitHub Actions". For a custom domain, set it
# under Settings, Pages too (GitHub writes the CNAME for an Actions deploy).
name: Demo site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: build the cards and the site
        run: |
          node build.mjs
          npm install --no-save @mdi/js
          node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
